###############################################
# HOW TO 
# 1. Enter raw Gaia NSS values for ONE star.
# 2. corr_vec length must match Gaia NSS model:
#       Acceleration7 --> npar = 7  → len(corr_vec) = 21  
#       Acceleration9 --> npar = 9  → len(corr_vec) = 36   
# 3. Run:
#       python gaia_accel_gen_fit.py gaia_accel_prep.ini
# 4. Use OUTPUT_FITS as HGCAFile and hip_id as HipID in ORVARA.
###############################################

[paths]
# HGCA_vEDR3.fits shipped with orvara (TEMPLATE only)
HGCA_TEMPLATE = HGCA_vEDR3.fits

# Output: 1-star Gaia acceleration file for ORVARA
OUTPUT_FITS = STAR7_gaia_accel.fits

[star]
# Gaia DR3 source_id for LSPM J2043+0445
source_id = 

# Synthetic Hipparcos ID (choose any unused integer, must not conflict with real HIP numbers)
hip_id = 200000

[advanced]
# Multiplicative factor applied to Gaia acceleration errors.
# Suggested default from DR3 Astrometry comparison: 2
# Set to 1 to use raw Gaia DR3 errors with no inflation.
error_inflation_factor = 2

[gaia_solution]
# Number of Gaia NSS astrometric parameters:
#   7 → Acceleration7:  ra, dec, parallax, pmra, pmdec, accra, accdec
#   9 → Acceleration9:  Acceleration7 + deriv_accra, deriv_accdec
npar = 7

# Gaia astrometric solution
ra       = 
ra_err   = 

dec      = 
dec_err  = 

parallax      = 
parallax_err  = 

pmra      = 
pmra_err  = 

pmdec     = 
pmdec_err = 

rv        = 
rv_err    = 
rv_source = Gaia_DR3

# Gaia NSS astrometric acceleration solution
accra      = 
accra_err  = 

accdec     = 
accdec_err = 

# addtional terms ONLY for npar=9 (Acceleration9)
# deriv_accra     =
# deriv_accra_err =
# deriv_accdec    =
# deriv_accdec_err =

# Gaia DR3 CORR_VEC: must be 21 terms for npar=7 and must be 36 terms for npar=9
corr_vec = 
